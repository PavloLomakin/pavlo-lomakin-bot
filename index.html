function norm(s) {
  return s.toLowerCase().replace(/ё/g, "е").replace(/[^a-zа-я0-9\s-]/g, " ").replace(/\s+/g, " ").trim();
}
function tokens(s) { return norm(s).split(" ").filter(function(w){ return w.length > 2; }); }

function findAnswer(query) {
  const nq = " " + norm(query) + " ";
  const qToks = tokens(query);
  let best = null, bestScore = 0;
  QA.forEach(function(entry) {
    let s = 0;
    entry.keywords.forEach(function(kw) {
      const k = norm(kw);
      if (!k) return;
      if (nq.indexOf(k) !== -1) { s += k.length * 2; return; }
      // word-form tolerance: shared 4-letter prefix for words of 5+ letters
      if (k.length >= 5) {
        const stem = k.slice(0, 4);
        for (let i = 0; i < qToks.length; i++) {
          const t = qToks[i];
          if (t.length >= 5 && t.slice(0, 4) === stem) { s += 5; break; }
        }
      }
    });
    const eToks = new Set(tokens(entry.question));
    qToks.forEach(function(t) { if (eToks.has(t)) s += 3; });
    if (s > bestScore) { bestScore = s; best = entry; }
  });
  return bestScore >= 6 ? best : null;
}

function addMsg(cls, html) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.innerHTML = html;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}
function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function answerHtml(entry) {
  let h = esc(entry.answer);
  if (entry.post_links && entry.post_links.length) {
    h += '<div class="links"><span>Читать в Threads:</span>';
    entry.post_links.forEach(function(l) {
      h += '<a href="' + esc(l.url) + '" target="_blank" rel="noopener">↗ ' + esc(l.label) + '</a>';
    });
    h += '</div>';
  }
  return h;
}
function ask(text) {
  const q = (text || "").trim();
  if (!q) return;
  addMsg("user", esc(q));
  input.value = "";
  const t = addMsg("bot typing", "печатаю...");
  setTimeout(function() {
    t.remove();
    const entry = findAnswer(q);
    if (entry) {
      addMsg("bot", answerHtml(entry));
    } else {
      addMsg("bot", "Не нашёл точного ответа в своей базе. Попробуйте переформулировать - или выберите вопрос из популярных выше, там точно есть ответ.");
    }
  }, 600);
}

document.getElementById("send").addEventListener("click", function(){ ask(input.value); });
input.addEventListener("keydown", function(e){ if (e.key === "Enter") ask(input.value); });

const grid = document.getElementById("faqGrid");
QA.forEach(function(entry) {
  const b = document.createElement("button");
  b.textContent = entry.question;
  b.addEventListener("click", function(){ ask(entry.question); });
  grid.appendChild(b);
});
